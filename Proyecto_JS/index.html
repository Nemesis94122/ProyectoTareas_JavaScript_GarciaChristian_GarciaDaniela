<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>

    <div class="contenedor">

        <header class="encabezado">

            <div>
                <p class="fecha">MONDAY, APRIL 14</p>
                <h1>Mis tareas</h1>
                <p class="subtitulo">
                    Open tasks across your workspace
                </p>
            </div>

            <div class="botones">

                <button class="btn-import">Importar tarea</button>

                <button class="btn-create" id="abrirModal">+ Crear tarea</button>

            </div>

        </header>

        <div class="menu">

            <div class="filtros">
                <a href="#" class="activo">All</a>
                <a href="#">Open</a>
                <a href="#">Completed</a>
            </div>

            <div class="acciones">
                <a href="#">Import from API</a>
                <a href="#">Clear list</a>
            </div>

        </div>

        <!-- LAS TAREAS DE LA API IRÁN AQUÍ -->
        <div class="lista" id="listaTareas">

            <div class="tarea">

                <input type="checkbox">

                <div class="titulo">
                    Ejemplo de tarea
                </div>

                <div class="categoria product">
                    <span></span>
                    Product
                </div>

                <div class="info">
                    <p>06/11/2026</p>
                    <small>Not finished</small>
                </div>

            </div>

        </div>

    </div>

    <!-- MODAL -->

    <div class="modal" id="modal">

        <div class="modal-contenido">

            <button class="cerrar" id="cerrarModal">
                ×
            </button>

            <p class="modal-subtitulo">
                Nueva Tarea
            </p>

            <h2>Crear una tarea</h2>

            <form>

                <label>Task title</label>

                <input
                    type="text"
                    class="input-grande"
                    placeholder="What needs to be done?"
                >

                <div class="fila">

                    <div class="grupo">

                        <label>Project</label>

                        <select>
                            <option>Product</option>
                            <option>Design</option>
                            <option>Operations</option>
                            <option>Research</option>
                        </select>

                    </div>

                    <div class="grupo">

                        <label>Priority</label>

                        <select>
                            <option>Low</option>
                            <option selected>Medium</option>
                            <option>High</option>
                        </select>

                    </div>

                </div>

                <div class="fila">

                    <div class="grupo">

                        <label>Registration date</label>

                        <input type="date">

                    </div>

                    <div class="grupo">

                        <label>Completion date</label>

                        <input type="date">

                    </div>

                </div>

                <label class="check-fin">

                    <input type="checkbox">

                    Mark this task as finished

                </label>

                <div class="acciones-modal">

                    <button
                        type="button"
                        class="btn-cancel"
                        id="cancelarModal">
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn-guardar">
                        Create task
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="JavaScript-modal.js"></script>

</body>

</html>
