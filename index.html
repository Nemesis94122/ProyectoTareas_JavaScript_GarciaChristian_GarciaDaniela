<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tareas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <div class="encabezado">
            <div>
                <p class="fecha">TAREAS DE HOY</p>
                <h1>Mis tareas</h1>
                <p class="subtitulo">Tareas abiertas en tu espacio</p>
            </div>
        </div>
        <todo-app></todo-app>
    </div>

    <template id="todo-app-template">
        <div class="menu">
            <div class="filtros">
                <input type="text" id="bus" placeholder="Buscar tarea..." class="input-grande" style="max-width: 250px; margin-bottom: 0; padding: 10px 15px;">
                <select id="flt" style="max-width: 180px; margin-bottom: 0; padding: 10px 15px;">
                    <option value="todas">Todas</option>
                    <option value="pendientes">Pendientes</option>
                    <option value="completadas">Completadas</option>
                </select>
            </div>
            <div class="botones">
                <button id="imp" class="btn-import">Importar desde API</button>
                <button id="nva" class="btn-create">Crear tarea</button>
                <button id="mar" class="btn-import">Marcar todas</button>
                <button id="vac" class="btn-import" style="color: #cf6d4d; border-color: #cf6d4d;">Borrar lista</button>
            </div>
        </div>

        <div class="lista">
            <ul id="lst" style="list-style: none; padding: 0; margin: 0;"></ul>
        </div>

        <dialog id="mdl-f">
            <div class="modal-contenido">
                <button type="button" class="cerrar" onclick="this.closest('dialog').close()">×</button>
                <p class="modal-subtitulo">NUEVA TAREA</p>
                <h2>Crear una tarea</h2>
                <form id="frm">
                    <label>Nombre de la tarea</label>
                    <input type="text" id="ttl" class="input-grande" placeholder="Ej. Redactar informe de operaciones" required>
                    <label>Fecha de Registro</label>
                    <input type="date" id="fch" required>
                    <div class="check-fin">
                        <input type="checkbox" id="cmp">
                        <label for="cmp" style="margin-bottom: 0; cursor: pointer;">Marca esta tarea como finalizada</label>
                    </div>
                    <div class="acciones-modal">
                        <button type="button" class="btn-cancel" onclick="this.closest('dialog').close()">Cancelar</button>
                        <button type="submit" class="btn-guardar">Guardar tarea</button>
                    </div>
                </form>
            </div>
        </dialog>

        <dialog id="mdl-i">
            <div class="modal-contenido">
                <button type="button" class="cerrar" onclick="this.closest('dialog').close()">×</button>
                <p class="modal-subtitulo">Importación desde API</p>
                <h2>Importar tareas</h2>
                <ul id="api-lst" style="max-height: 250px; overflow-y: auto; list-style: none; padding: 0; margin-bottom: 20px;"></ul>
                <div class="acciones-modal">
                    <button type="button" class="btn-cancel" onclick="this.closest('dialog').close()">Cerrar</button>
                    <button type="button" id="cnf" class="btn-guardar">Importar seleccionadas</button>
                </div>
            </div>
        </dialog>
    </template>

    <template id="tarea-item-template">
        <li class="tarea" style="list-style: none;">
            <div>
                <input type="checkbox" class="chk" style="transform: scale(1.2); cursor:pointer;">
            </div>
            <div class="titulo"></div>
            <div class="categoria info">
                <span></span>
                <strong class="fecha-txt" style="font-weight: normal; margin-right: 10px;"></strong>
                <small></small>
            </div>
            <div class="botones" style="justify-content: flex-end; gap: 10px;">
                <button class="edi btn-import" style="padding: 5px 15px; border-radius: 6px;">Editar</button>
                <button class="del btn-import" style="padding: 5px 15px; border-radius: 6px; color: #cf6d4d; border-color: #cf6d4d;">Eliminar</button>
            </div>
        </li>
    </template>

    <script src="app.js"></script>
</body>
</html>
