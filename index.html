<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis tareas</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <div class="contenedor">
        <header class="encabezado">
            <div>
                <p class="fecha">MONDAY, APRIL 14</p>
                <h1>Mis tareas</h1>
                <p class="subtitulo"> Tareas abiertas en tu espacio de trabajo </p>
            </div>
            <div class="botones">
                <button class="btn-import">Importar tarea</button>
                <button class="btn-create" id="abrirModal">+ Crear tarea</button>
            </div>
        </header>
        
        <div class="menu">
            <div class="filtros">
                <a href="#" class="activo">Todas</a>
                <a href="#">Abrir</a>
                <a href="#">Completado</a>
            </div>
            <div class="acciones">
                <a href="#">Importar desde la API</a>
                <a href="#">Limpiar lista </a>
            </div>
        </div>
        <div class="lista" id="listaTareas">
            <div class="tarea">
                <input type="checkbox" required>
                <div class="titulo">
                    Ejemplo de tarea
                </div>
                <div class="categoria product">
                    <span></span>
                    Producto
                </div>
                <div class="info">
                    <p>06/11/2026</p>
                    <small>No finalizado</small>
                </div>
            </div>
        </div>
    </div>
    <div class="modal" id="modal">
        <div class="modal-contenido">
            <button class="cerrar" id="cerrarModal"> X </button>
            <p class="modal-subtitulo">  Nueva Tarea </p>
            <h2>Crear una tarea</h2>
            <form>
                <label>Titulo de la tarea</label>
            <input type="text" class="input-grande" placeholder="¿Qué tarea vamos a crear?" required>
                <div class="fila">
                    <div class="grupo">
                        <label>Proyecto</label>
                        <select>
                            <option>Producto</option>
                            <option>Diseño</option>
                            <option>Operaciones</option>
                            <option>Investigación</option>
                        </select>
                    </div>
                    <div class="grupo">
                        <label>Prioridad</label>
                        <select>
                            <option>Baja</option>
                            <option selected>Media</option>
                            <option>Alta</option>
                        </select>
                    </div>
                </div>
                <div class="fila">
                    <div class="grupo">
                        <label>Registrar fecha</label>
                        <input type="date" required>
                    </div>
                    <div class="grupo">
                        <label>Fecha de finalización</label>
                        <input type="date">
                    </div>
                </div>
                <label class="check-fin">
                    <input type="checkbox" required>
                    Marcar tarea como terminada
                </label>
                <div class="acciones-modal">
                    <button type="button" class="btn-cancel" id="cancelarModal">Cancelar</button>
                    <button
                        type="submit"
                        class="btn-guardar">
                        Crear tarea
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
